<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Najja Editor</title>
  <meta name="description" content="Najja Editor — editor video berbasis web dengan timeline multi-track, teks, stiker, efek, transisi, filter, dan server MCP untuk AI agent.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;0,900;1,700&family=Bebas+Neue&family=Anton&family=Oswald:wght@400;700&family=Archivo+Black&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Pacifico&family=Lobster&family=Caveat:wght@400;700&family=Dancing+Script:wght@700&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar"></header>
    <main class="workspace">
      <nav id="rail" class="rail" aria-label="Kategori aset"></nav>
      <section id="library" class="library" aria-label="Pustaka"></section>
      <div class="rz rz-v" data-resize="lib" aria-hidden="true"></div>
      <section id="viewer" class="viewer" aria-label="Pemutar"></section>
      <div class="rz rz-v rz-insp" data-resize="insp" aria-hidden="true"></div>
      <aside id="inspector" class="inspector" aria-label="Properti"></aside>
    </main>
    <div class="rz rz-h" data-resize="tl" aria-hidden="true"></div>
    <section id="timeline" class="timeline" aria-label="Timeline"></section>
  </div>
  <div class="boot"><div class="boot-logo"></div><span>Najja Editor</span></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
