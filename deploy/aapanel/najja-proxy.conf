# Najja Editor: no nginx proxy cache for the editor site, so videos can be streamed in pieces (Range requests).
#
# aaPanel's global /www/server/nginx/conf/proxy.conf turns on `proxy_cache cache_one;` for every site. With a proxy
# cache on, nginx does not pass the Range header to the app (nginx docs, proxy_cache), and the app never lets nginx
# store anything (Cache-Control: no-cache), so every Range request got the WHOLE file as 200 instead of 206:
#  - the preview downloaded the video again from byte 0 at every seek and stayed black meanwhile (Chrome);
#  - Safari (iPad, Mac) needs 206 for video, so the video could not play there at all;
#  - a device-cache download that was cut off could not resume.
# The editor keeps its own caches (service worker, device cache), so nginx has nothing useful to keep.
#
# Where: /www/server/panel/vhost/nginx/extension/<domain>/najja-proxy.conf
#   aaPanel includes every *.conf of that folder inside the site's server block; the site's locations inherit this.
#   Only this site changes; other sites keep aaPanel's proxy cache.
# Then:  nginx -t && nginx -s reload
# Check: curl -s -o /dev/null -w '%{http_code}\n' -r 0-9 https://<domain>/favicon.svg   → 206 (was 200)
# Undo:  delete the file, then nginx -t && nginx -s reload

proxy_cache off;
