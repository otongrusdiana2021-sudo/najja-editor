# Najja Editor (P0-4): OAuth discovery for AI clients (MCP), on an aaPanel site.
#
# aaPanel answers every /.well-known/ path from the site folder (that is how it checks SSL certificates), so the
# OAuth metadata the editor serves there answered 404 and clients that only use discovery could not connect.
# These two locations send just the OAuth paths to the editor. Certificate checks (/.well-known/acme-challenge/)
# are untouched: they still go to the site folder.
#
# Where: /www/server/panel/vhost/nginx/extension/<domain>/najja-wellknown.conf
#   aaPanel includes every *.conf of that folder inside the site's server block (it keeps its own site_total.conf there).
# Then:  nginx -t && nginx -s reload
# Undo:  delete the file, then nginx -t && nginx -s reload
#
# The headers are the ones of the site's own reverse proxy (location ^~ / in the aaPanel site config).

location ^~ /.well-known/oauth- {
    proxy_pass http://127.0.0.1:3333;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
}

location = /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:3333;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
}
